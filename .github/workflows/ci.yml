# SPDX-License-Identifier: GPL-2.0-only
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  core:
    name: core + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        run: make test

      # The protocol stack is full of buffer arithmetic over fixed tables, so
      # the sanitised run is the one that actually matters.
      - name: Sanitizers
        run: make sanitize

      # core/ is compiled for a Cortex-M0+ with no libc beyond string.h.
      # Anything that creeps in gets caught here rather than at flash time.
      - name: Freestanding
        run: make freestanding

      - name: CMake build
        run: |
          cmake -B build-cmake -S .
          cmake --build build-cmake
          ctest --test-dir build-cmake --output-on-failure

  clang:
    name: clang + strict warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with clang
        run: make test CC=clang

  coordinator:
    name: coordinator daemon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Includes the end-to-end test, which runs the real daemon against a
      # pty with a real chain board on the other end.
      - name: Build and test
        run: |
          cmake -B build-coord -S coordinator
          cmake --build build-coord -j"$(nproc)"
          ctest --test-dir build-coord --output-on-failure

  firmware:
    name: rp2040 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Pico SDK
        run: |
          git clone --depth 1 --branch 2.1.1 \
            https://github.com/raspberrypi/pico-sdk ~/pico-sdk
          cd ~/pico-sdk && git submodule update --init --depth 1 lib/tinyusb

      # The firmware cannot be run here, but a link failure or a dual-core
      # hazard introduced in core/ shows up as a build break, which is most of
      # what CI can usefully catch for an embedded target.
      - name: Build firmware
        env:
          PICO_SDK_PATH: /home/runner/pico-sdk
        run: |
          cmake -B build-fw -S firmware/rp2040
          cmake --build build-fw -j"$(nproc)"
          arm-none-eabi-size build-fw/deskhop_plus.elf

      - uses: actions/upload-artifact@v4
        with:
          name: deskhop_plus-uf2
          path: build-fw/deskhop_plus.uf2
